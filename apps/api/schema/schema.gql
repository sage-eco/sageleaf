  """Physical components that make up this variant"""
  components(after: String, before: String, first: Int, last: Int): VariantComponentsConnection!
  createdAt: DateTime!
  desc: String

  """Audit history of changes to this variant"""
  history(after: String, before: String, first: Int, last: Int): VariantHistoryConnection!
  id: ID!
  imageURL: String

  """Images associated with this variant"""
  images(after: String, before: String, first: Int, last: Int): ImagesConnection!

  """Product items this variant belongs to"""
  items(after: String, before: String, first: Int, last: Int): ItemsConnection!
  name: String

  """
  Organizations associated with this variant (e.g. manufacturer, importer)
  """
  orgs(after: String, before: String, first: Int, last: Int): VariantOrgsConnection!

  """Recycling or disposal processes specific to this variant"""
  processes(after: String, before: String, first: Int, last: Int): ProcessConnection!

  """Recycling options for this variant, one entry per recycling stream"""
  recycle(regionID: ID): [VariantRecycle!]!

  """Aggregated recyclability score for this variant"""
  recycleScore(regionID: ID): StreamScore

  """Reduce options for this variant, one entry per reduce stream"""
  reduce(regionID: ID): [VariantReduce!]!

  """Aggregated reduce score for this variant"""
  reduceScore(regionID: ID): StreamScore

  """Geographic regions associated with this variant"""
  regions(after: String, before: String, first: Int, last: Int): RegionsConnection!

  """Similar variants related to this variant"""
  related(limit: Int, offset: Int, query: String): VariantsConnection!

  """Reuse options for this variant, one entry per reuse stream"""
  reuse(regionID: ID): [VariantReuse!]!

  """Aggregated reuse score for this variant"""
  reuseScore(regionID: ID): StreamScore
  sources(after: String, before: String, first: Int, last: Int): VariantSourcesConnection!

  """Metadata tags applied to this variant"""
  tags(after: String, before: String, first: Int, last: Int): TagConnection!
  updatedAt: DateTime!
}

